name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - feature/10-0-life-vision
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  issues: write

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=rahmatullah-10-life
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
            --commit-message="${{ github.event.head_commit.message || 'Manual deployment' }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Astro build completed, but deployment was skipped."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub environment or repository secrets."

      - name: Report deployment on PR
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.cloudflare.outcome }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        with:
          script: |
            const outcome = process.env.DEPLOY_OUTCOME || 'not-run';
            const deploymentUrl = process.env.DEPLOYMENT_URL || '';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const mode = context.ref === 'refs/heads/main' ? 'production' : 'preview';
            const body = [
              `## Cloudflare ${mode} deployment`,
              '',
              `- Result: **${outcome}**`,
              deploymentUrl ? `- URL: ${deploymentUrl}` : '- URL: not returned',
              `- Branch: \`${context.ref.replace('refs/heads/', '')}\``,
              `- Workflow run: ${runUrl}`,
              `- Commit: \`${context.sha}\``
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              body,
            });
