name: Deploy Cloudflare Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/10-0-life-vision
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref == 'feature/10-0-life-vision') && !contains(github.event.head_commit.message || '', '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      DEPLOY_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Astro site
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/rahmatullah-10-life"
          http_code="$(curl --silent --show-error --output project-response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "${project_url}")"

          if [[ "${http_code}" == "404" ]]; then
            echo "Cloudflare Pages project does not exist; creating it."
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"name":"rahmatullah-10-life","production_branch":"main"}'
          elif [[ "${http_code}" != "200" ]]; then
            echo "Unable to inspect the Cloudflare Pages project (HTTP ${http_code})."
            cat project-response.json
            exit 1
          else
            echo "Cloudflare Pages project already exists."
          fi

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=rahmatullah-10-life
            --branch=${{ env.DEPLOY_BRANCH }}
            --commit-hash=${{ env.DEPLOY_COMMIT }}
            --commit-message="${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual deployment' }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Astro build completed, but deployment was skipped."
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub repository secrets."

      - name: Record production deployment
        if: ${{ always() && github.event_name == 'push' && github.ref_name == 'main' }}
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.cloudflare.outcome }}
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        with:
          script: |
            const path = 'deployment-status.json';
            const payload = {
              environment: 'production',
              result: process.env.DEPLOY_OUTCOME || 'not-run',
              url: process.env.DEPLOYMENT_URL || '',
              source_commit: context.sha,
              workflow_run: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              recorded_at: new Date().toISOString(),
            };

            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main',
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'main',
              message: 'ci: record production deployment [skip deploy]',
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64'),
              ...(sha ? { sha } : {}),
            });
